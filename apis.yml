aid: usa-rare-earth
name: USA Rare Earth
description: 'USA Rare Earth, Inc. (Nasdaq: USAR) is an American critical-minerals and advanced-materials
  company building a domestic mine-to-magnet rare earth supply chain. It operates a 310,000 sq. ft. sintered
  neodymium-iron-boron (NdFeB) permanent magnet manufacturing facility in Stillwater, Oklahoma, and holds
  the Round Top heavy rare earth and critical minerals deposit in Hudspeth County, West Texas. The company
  produces rare earth elements, oxides, metals and sintered permanent magnets for defense, automotive,
  robotics, industrial and clean-energy customers, with the stated aim of reducing U.S. dependence on
  offshore rare earth processing and magnet production. It is a materials producer and manufacturer, not a
  software or data company, and publishes no public developer program, API, or machine-readable interface.'
